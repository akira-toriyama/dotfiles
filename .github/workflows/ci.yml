name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 毎日 15:00 UTC = 00:00 JST。cold な再現検証を定期実行し upstream drift
    # (flake.lock 不変でも nix-darwin/master・cask tap・substituter が動いた等) を拾う。
    - cron: '0 15 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, made explicit — closes zizmor's excessive-permissions
# finding ahead of the fleet-wide zizmor gate (akira-toriyama/.github t-qbp1).
permissions:
  contents: read

jobs:
  # ── 軽量チェック（Linux・毎 PR/push で必ず走る = PR の実質ゲート）────────────
  # nix の評価チェック。--no-build で darwin 固有のビルドはせず eval のみ。
  nix-flake-check:
    name: nix flake check (eval only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # CI-only, never pushes — drop the persisted checkout token. t-yaxa
          persist-credentials: false

      - name: Install Nix (Determinate)
        uses: DeterminateSystems/nix-installer-action@a7ad9c4f0c65208097f4d34f3cfa1913b80cce5c # main

      - name: nix flake check --no-build
        run: nix flake check --no-build --show-trace

  # シェルスクリプトの静的解析（install.sh のみ。.tmpl は chezmoi 構文が混ざるので除外）
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # CI-only, never pushes — drop the persisted checkout token. t-yaxa
          persist-credentials: false

      - name: Run shellcheck on install.sh
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master
        with:
          scandir: '.'
          additional_files: 'install.sh'
          ignore_paths: 'chezmoi .git'

  # 規約チェック: chezmoi 配下のスクリプトは executable_ 接頭辞を持つこと。
  # 例外: run_* / .chezmoiscripts/ 配下 (chezmoi 自身が実行 = $HOME に展開しない)。
  convention-executable-prefix:
    name: convention / executable_ prefix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # CI-only, never pushes — drop the persisted checkout token. t-yaxa
          persist-credentials: false
      - name: Check shebang scripts under chezmoi/ have executable_ prefix
        run: |
          set -e
          violations=$(
            find chezmoi -type f \
              \( -name '*.sh' -o -name '*.py' -o -name '*.zsh' -o -name '*.bash' \) \
              -not -path '*/.chezmoiscripts/*' \
              -not -name 'run_*' \
              | while IFS= read -r f; do
                  if head -1 "$f" | grep -q '^#!' \
                     && [[ "$(basename "$f")" != executable_* ]]; then
                    echo "$f"
                  fi
                done
          )
          if [ -n "$violations" ]; then
            echo "::error::shebang script under chezmoi/ without executable_ prefix:"
            echo "$violations" | sed 's/^/  - /'
            exit 1
          fi
          echo "✅ executable_ 規約 OK"

  # 規約チェック: ~/.claude/commands/ 配下 (= 自作 slash command) は my- 接頭辞。
  # built-in / plugin の command は別の場所に住むため、この dir のファイルは
  # 定義上すべて自作 → 全 *.md を対象に my- 始まりを強制する。
  convention-command-prefix:
    name: convention / my- command prefix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # CI-only, never pushes — drop the persisted checkout token. t-yaxa
          persist-credentials: false
      - name: Check self-made commands have my- prefix
        run: |
          set -e
          dir=chezmoi/private_dot_claude/commands
          violations=$(
            find "$dir" -type f -name '*.md' 2>/dev/null | while IFS= read -r f; do
              base=$(basename "$f")
              # chezmoi 属性 prefix を剥いでから slash command 名を判定
              name=${base#private_}; name=${name#dot_}; name=${name#readonly_}
              if [[ "$name" != my-* ]]; then
                echo "$f"
              fi
            done
          )
          if [ -n "$violations" ]; then
            echo "::error::self-made command under commands/ without my- prefix:"
            echo "$violations" | sed 's/^/  - /'
            exit 1
          fi
          echo "✅ my- command prefix 規約 OK"

  # chezmoi テンプレートのレンダリング検証（構文エラー早期検出）
  chezmoi-templates:
    name: chezmoi templates render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # CI-only, never pushes — drop the persisted checkout token. t-yaxa
          persist-credentials: false

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Render each .tmpl
        # chezmoi の include は --source が指す source dir 起点で解決されるため、
        # repo の chezmoi/ を明示する。
        run: |
          set -e
          failed=0
          while IFS= read -r f; do
            echo "::group::Render $f"
            if ! chezmoi --source ./chezmoi execute-template < "$f" >/dev/null; then
              echo "::error file=$f::template render failed"
              failed=1
            fi
            echo "::endgroup::"
          done < <(find . -path ./.git -prune -o -name '*.tmpl' -print | grep -v '^./.git/')
          exit $failed

  # ── フル再現検証（macOS・cold・重い）─────────────────────────────────────────
  # Opt 1'': 通常 PR では走らせず、merge 後の main push / nightly / 手動で実行。
  # ただし flake 入力・nix モジュールを触る PR は activation を壊し得る
  # (2026-07-06〜18 の brew 6 skew を 13 夜見逃した実績、t-8qqz/t-j09q) ので、
  # flake-changes 判定で PR でも実行して merge 前に検出する。
  # 「install.sh が新 Mac で cold bootstrap を通す」保証の enforce がこの2ジョブ。
  # ★ キャッシュは意図的に使わない ── warm cache は cold fetchability
  #   (消えた substituter / fixed-output の hash drift / 死んだ cask tap / 404 flake input)
  #   の検証を痩せさせる。速度は「頻度を下げる」(per-PR から外す) で稼ぐ。
  # ★ build(.#default) と switch(.#ci) は別 attr(username/masApps が違う)なので両方要る。

  # PR が flake 入力・nix モジュールを触ったかの判定。checkout 不要 (PR files API)。
  # push/schedule では skip され、darwin ジョブ側の `!cancelled() && (非PR || hit)`
  # 条件が従来どおり無条件実行に解決する。
  flake-changes:
    name: detect flake-affecting changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      hit: ${{ steps.diff.outputs.hit }}
    steps:
      - name: Check changed files via PR files API
        id: diff
        # zizmor template-injection 対策: 参照はすべて env 経由 (#193 と同方針)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          hit=false
          if printf '%s\n' "$files" | grep -qE '^(flake\.(nix|lock)$|system/|home/|\.github/workflows/ci\.yml$)'; then
            hit=true
          fi
          echo "hit=$hit" >> "$GITHUB_OUTPUT"
          printf 'hit=%s\nchanged files:\n%s\n' "$hit" "$files"

  # macOS 実機相当(arm64)で darwin-rebuild build を回し、flake が活性化可能かを
  # End-to-end に近い形で証明する。switch はしない(非破壊)。
  darwin-build:
    name: darwin-rebuild build (macOS)
    needs: [flake-changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.flake-changes.outputs.hit == 'true') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # CI-only, never pushes — drop the persisted checkout token. t-yaxa
          persist-credentials: false

      - name: Install Nix (Determinate)
        uses: DeterminateSystems/nix-installer-action@a7ad9c4f0c65208097f4d34f3cfa1913b80cce5c # main

      - name: nix-darwin build (default host alias)
        run: nix run nix-darwin/master#darwin-rebuild -- build --flake .#default --show-trace

  # 実 switch によるスモークテスト。新PCで install.sh を回した時の挙動を
  # macos-latest runner で再現する(masApps だけ App Store サインイン不要のため空)。
  # runner は ephemeral なので副作用 OK。
  darwin-switch-smoke:
    name: darwin-rebuild switch smoke (macOS)
    needs: [flake-changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.flake-changes.outputs.hit == 'true') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # CI-only, never pushes — drop the persisted checkout token. t-yaxa
          persist-credentials: false

      - name: Install Nix (Determinate)
        uses: DeterminateSystems/nix-installer-action@a7ad9c4f0c65208097f4d34f3cfa1913b80cce5c # main

      - name: Make way for nix-homebrew (remove preinstalled Homebrew)
        # GitHub の macos ランナーは /opt/homebrew を preinstall するが、
        # イメージ更新 (20260610 → 20260623) で git checkout でなくなり、
        # nix-homebrew (autoMigrate=true) の移管が
        # "/opt/homebrew does not looks like a Homebrew checkout" で失敗する。
        # CI では preinstalled brew を退け、nix-homebrew にクリーンに入れさせる。
        run: sudo rm -rf /opt/homebrew /usr/local/Homebrew /usr/local/bin/brew

      - name: darwin-rebuild switch (CI variant, masApps 空)
        run: sudo nix run nix-darwin/master#darwin-rebuild -- switch --flake .#ci --show-trace

      - name: Verify CLI on PATH（flake から自動導出 = drift しない）
        # GitHub Actions の step shell は login shell ではないので
        # /etc/zshenv 経由の nix path がロードされない。明示的に追加する。
        # 期待リストは casks 検証と同じく flake config を単一ソースに導出する:
        # home.packages の各 store path（switch 済みなので realize 済み）の bin/* を
        # 列挙し、全 binary が PATH で解決できることを確認。手書きリストは drift する
        # 実績あり (#212 が docker/docker-compose/colima を drop した際ここが未追従で、
        # brew 6 修正後の初 smoke が落ちた。07-06〜18 は switch が先に死んでいて検出不能)。
        # 導出が空になる縮退（eval 変更や user 名変更）も明示 fail で検出する。
        run: |
          export PATH="/etc/profiles/per-user/runner/bin:/run/current-system/sw/bin:/nix/var/nix/profiles/default/bin:$PATH"
          nix eval --impure --json ".#darwinConfigurations.ci.config.home-manager.users.runner.home.packages" \
            --apply "map (p: p.outPath)" | jq -r '.[]' > /tmp/hm_pkgs.txt
          fail=0 n=0
          while IFS= read -r p; do
            [ -d "$p/bin" ] || continue
            for b in "$p"/bin/*; do
              [ -e "$b" ] || continue
              c=$(basename "$b")
              n=$((n + 1))
              if path=$(which "$c" 2>/dev/null); then
                echo "  ✓ $c -> $path"
              else
                echo "  ✗ $c (not found on PATH)"; fail=1
              fi
            done
          done < /tmp/hm_pkgs.txt
          if [ "$n" -eq 0 ]; then
            echo "::error::home.packages から binary を 1 つも導出できていない（eval 縮退の疑い）"
            exit 1
          fi
          echo "checked $n binaries"
          exit "$fail"

      - name: Verify casks installed（flake から自動導出 = drift しない）
        # 期待リストは homebrew.nix を単一ソースに flake config から導出する。
        # 手書きリストは drift する実績あり (obsidian/monodraw が欠落し under-verify した)。
        # Apple Silicon 側 brew を明示 (PATH 先頭が旧 x86 brew を引くと別 Caskroom を見て
        # missing 誤判定になる)。
        run: |
          export PATH="/etc/profiles/per-user/runner/bin:/run/current-system/sw/bin:/nix/var/nix/profiles/default/bin:$PATH"
          nix eval --impure --json ".#darwinConfigurations.ci.config.homebrew.casks" \
            | jq -r '.[] | if type=="string" then . else .name end' | sort > /tmp/expected_casks.txt
          echo "--- 期待 casks（flake 由来・単一ソース）---"; cat /tmp/expected_casks.txt
          /opt/homebrew/bin/brew list --cask | sort > /tmp/installed_casks.txt
          echo "--- installed casks (Apple Silicon brew) ---"; cat /tmp/installed_casks.txt
          missing=$(comm -23 /tmp/expected_casks.txt /tmp/installed_casks.txt)
          if [ -n "$missing" ]; then
            echo "::error::declared cask(s) not installed:"
            echo "$missing" | sed 's/^/  - /'
            exit 1
          fi
          echo "✅ 全 declared cask が install 済み"

      - name: chezmoi apply (dot_claude / VSCode 拡張 / 他)
        run: |
          export PATH="/etc/profiles/per-user/runner/bin:/run/current-system/sw/bin:/nix/var/nix/profiles/default/bin:$PATH"
          chezmoi --source ./chezmoi apply --verbose

  # ── ゲート（branch protection の唯一の必須チェック）──────────────────────────
  # always() で常に走り全ジョブを needs。macOS が PR で skip されても skip は
  # 「非 failure」なので緑を通し、必須チェックが deadlock しない (GitHub 公式の
  # skipped-but-required 回避パターン)。実 failure/cancelled のみ落とす。
  # ★ branch protection の required status checks は「ci-gate」1本だけにすること。
  #   個別ジョブを required に残すと、PR で skip された macOS が pending 化し得る。
  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - nix-flake-check
      - shellcheck
      - convention-executable-prefix
      - convention-command-prefix
      - chezmoi-templates
      - flake-changes
      - darwin-build
      - darwin-switch-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        # needs は信頼済みコンテキストだが、zizmor template-injection を避けるため
        # run: に直接展開せず env 経由で渡す (#193 の INPUT_TAG と同方針)。
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "A required upstream job failed:"
          echo "$NEEDS_JSON"
          exit 1
      - run: echo "All required jobs passed or were intentionally skipped."

  # ── 赤 main の強制可視化（t-j09q）────────────────────────────────────────────
  # schedule/push の failure は PR の視界に入らず、2026-07-06〜18 の 13 夜連続
  # failure を見逃した。main が赤くなったら固定タイトルの issue に集約して
  # 通知を発生させる（issue の新規作成/コメントはデフォルトで通知が飛ぶ）。
  notify-red-main:
    name: notify red main
    if: always() && github.event_name != 'pull_request' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs:
      - nix-flake-check
      - shellcheck
      - convention-executable-prefix
      - convention-command-prefix
      - chezmoi-templates
      - darwin-build
      - darwin-switch-smoke
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or comment on the red-main issue
        # zizmor template-injection 対策: 参照はすべて env 経由 (#193 と同方針)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          title="CI red on main"
          num=$(gh issue list --repo "$REPO" --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          body="\`$EVENT\` run failed: $RUN_URL"
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
