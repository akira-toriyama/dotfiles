# lychee.toml — Markdown のリンク切れ + 見出しアンカー検査（repo 所有）。
# cwd から自動ロードされる（--config 不要）。
#
# 実行モードは scripts/lint のグループで決める（CLI 直叩きではない）:
#   PR / push : `lychee` ゲート       = --offline    相対パス + アンカーのみ（0 network）
#   nightly   : `lychee-external`     = --offline 無し 外部 URL 込み
#               = OPT_IN_GROUPS の "external"。名指ししないと走らない。
#
# 【罠】RFC 2606 の予約 TLD（.invalid / .test / .example）と example.com は lychee が
# 既定で Excluded にする。ゲートの動作確認に .invalid を使うと「1 件 Excluded が
# 増えて緑」になり、**ゲートが壊れていても気づけない**（実測 2026-07-27）。
# 検証には実在ホストの 404 を使うこと。

# 見出しアンカー (#section) を検査する。日本語見出しも解決できることを実測済み
# （全角括弧・「」・/ は落ち、空白は - になる。GitHub の slug と一致するのは
#  この repo のコーパス範囲での確認であって、一般的保証ではない）。
# 値は none|anchor-only|text-only|full。CLI で渡す時は `=` 必須。
include_fragments = "anchor-only"

# 【罠】accept は既定を「置換」する。既定は 100..=103 と 200..=299 なので、
# 範囲を書き落とすと 201/204 が Rejected になる。429 は rate limit であって
# リンク切れではないので許容する。
accept = ["100..=103", "200..=299", "429"]

# 既定は 3 回 / 1 秒。ここでは待ちだけ 2 秒に伸ばす。
max_retries = 3
retry_wait_time = 2

exclude = [
  # akira-toriyama/projects は private repo。未認証だと GitHub が private を 404 で
  # 隠すので public CI では恒久的に落ちる。token を渡しても lychee の check_github は
  # private repo を「repo が見えれば OK」と rubber-stamp するだけでファイルの実在を
  # 確認しないので、検査価値そのものが無い。
  #
  # 【重要】末尾の (/|$) は必須。これが無いと将来 projects-public-thing のような
  # public repo へのリンクまで無言で Excluded になる。
  '^https://github\.com/akira-toriyama/projects(/|$)',
  # dotfiles-private も同じ理由（private repo・未認証 404・check_github は実在検査に
  # ならない）で除外する。
  '^https://github\.com/akira-toriyama/dotfiles-private(/|$)',
]
